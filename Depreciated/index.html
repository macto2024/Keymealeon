<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keymeleon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="surface">
    <header class="strip">
      <span class="conn"><i id="dot" class="dot"></i><span id="conn-text">Connecting…</span></span>
      <span id="app-name" class="app"></span>
    </header>

    <div id="keys" class="grid" role="group" aria-label="Six keys"></div>

    <footer class="strip foot">
      <span id="reason" class="reason"></span>
      <span id="page" class="page"></span>
    </footer>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
