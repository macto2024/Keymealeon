<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
<rect width="1100" height="760" fill="#f7fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#182b3a} .title{font-size:30px;font-weight:bold}.sub{font-size:16px}.label{font-size:17px}.small{font-size:14px}.box{fill:white;stroke:#243f52;stroke-width:2}.wire{fill:none;stroke:#207c93;stroke-width:3}.power{fill:none;stroke:#c23e48;stroke-width:3}.ground{fill:none;stroke:#485966;stroke-width:3}</style>
<text x="45" y="50" class="title">Keymaeleon · wiring schematic</text>
<text x="45" y="80" class="sub">Arduino Nano ESP32 · two independent software I²C buses · USB power and data</text>
<rect x="350" y="130" width="300" height="470" rx="16" class="box"/>
<text x="382" y="166" class="label" font-weight="bold">Arduino Nano ESP32</text>
<text x="384" y="190" class="small">Use printed board pin labels</text>
<rect x="440" y="210" width="120" height="42" rx="8" fill="#e0e9ef"/>
<text x="464" y="237" class="label">USB-C</text>
<path d="M500 252V275" class="wire"/><text x="394" y="297" class="small">To Ubuntu PC (data cable)</text>
<text x="375" y="340" class="label">D2 / GPIO5</text><text x="375" y="405" class="label">D3 / GPIO6</text>
<path d="M350 335H220" class="wire"/><circle cx="220" cy="335" r="4" fill="#243f52"/>
<path d="M170 335L210 315" stroke="#243f52" stroke-width="3"/><circle cx="170" cy="335" r="4" fill="#243f52"/>
<path d="M170 335H100V350" class="ground"/><path d="M83 350H117M88 357H112M94 364H106" class="ground"/>
<text x="87" y="290" class="label">Key 1 switch</text>
<path d="M350 400H220" class="wire"/><circle cx="220" cy="400" r="4" fill="#243f52"/>
<path d="M170 400L210 380" stroke="#243f52" stroke-width="3"/><circle cx="170" cy="400" r="4" fill="#243f52"/>
<path d="M170 400H100V430" class="ground"/><path d="M83 430H117M88 437H112M94 444H106" class="ground"/>
<text x="87" y="480" class="label">Key 2 switch</text>
<text x="66" y="514" class="small">Normally open contacts</text><text x="66" y="537" class="small">Internal pull-ups enabled</text>
<text x="497" y="340" class="label">A4 / GPIO11</text><text x="497" y="375" class="label">A5 / GPIO12</text>
<text x="497" y="460" class="label">D4 / GPIO7</text><text x="497" y="495" class="label">D5 / GPIO8</text>
<rect x="810" y="240" width="245" height="175" rx="10" class="box"/>
<text x="832" y="270" class="label" font-weight="bold">OLED 1 · key 1</text>
<text x="832" y="295" class="small">64 × 32 · I²C 0x3C</text>
<path d="M650 335H810M650 370H810" class="wire"/>
<text x="827" y="341" class="label">SDA</text><text x="827" y="376" class="label">SCL</text>
<path d="M910 240V207" class="power"/><path d="M1005 240V207" class="ground"/>
<text x="881" y="198" class="small">3V3</text><text x="988" y="198" class="small">GND</text>
<text x="893" y="320" class="small">VCC ↥   GND ↥</text>
<rect x="810" y="435" width="245" height="165" rx="10" class="box"/>
<text x="897" y="466" class="label" font-weight="bold">OLED 2</text>
<text x="897" y="489" class="small">key 2</text>
<path d="M650 455H810M650 490H810" class="wire"/>
<text x="827" y="461" class="label">SDA</text><text x="827" y="496" class="label">SCL</text>
<text x="830" y="532" class="small">64 × 32 · I²C 0x3C</text>
<text x="875" y="578" class="small">VCC ↓   GND ↓</text>
<path d="M910 600V626" class="power"/><path d="M1005 600V626" class="ground"/>
<text x="893" y="649" class="small">3V3</text><text x="987" y="649" class="small">GND</text>
<text x="397" y="559" class="label">3V3</text><text x="543" y="559" class="label">GND</text>
<path d="M418 570V625" class="power"/><text x="394" y="648" class="label">3V3</text>
<path d="M564 570V625" class="ground"/><text x="543" y="648" class="label">GND</text>
<text x="45" y="694" class="sub">All 3V3 labels connect together. All GND labels connect together. Do not join the two I²C buses.</text>
<text x="45" y="721" class="small">Add 4.7 kΩ from each SDA/SCL line to 3V3 only if module pull-ups are absent (four resistors total).</text>
<text x="45" y="744" class="small">Logical schematic, not physical header order. Follow module silkscreen; never apply 5 V to GPIO.</text>
</svg>
