<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
<rect width="1440" height="1120" fill="#f4f7fb"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#172e42}.box{fill:white;stroke:#496477;stroke-width:2}.wire{fill:none;stroke:#16839a;stroke-width:3}</style>
<text x="40" y="48" font-size="32" font-weight="bold">Keymaeleon 6 · Dual hardware I²C wiring</text>
<text x="40" y="80" font-size="19" font-weight="normal">Nano ESP32 · 2 rows × 3 keys · 2 × TCA9548A · all OLEDs at 0x3C</text>
<rect x="40" y="110" width="410" height="215" rx="12" class="box"/>
<text x="60" y="145" font-size="23" font-weight="bold">Arduino Nano ESP32</text>
<text x="60" y="178" font-size="16" font-weight="normal">Wire: A4/SDA, A5/SCL (GPIO11/12)</text>
<text x="60" y="211" font-size="16" font-weight="normal">Wire1: A6/SDA, A7/SCL (GPIO13/14)</text>
<text x="60" y="242" font-size="16" font-weight="normal">D8 / GPIO17 -&gt; top mux RESET</text>
<text x="60" y="273" font-size="16" font-weight="normal">D9 / GPIO18 -&gt; bottom mux RESET</text>
<text x="60" y="304" font-size="16" font-weight="normal">USB-C -&gt; PC; 3V3 / GND -&gt; all modules</text>
<rect x="480" y="110" width="920" height="215" rx="12" class="box"/>
<text x="502" y="145" font-size="23" font-weight="bold">Two independent hardware I²C buses</text>
<text x="502" y="180" font-size="17" font-weight="normal">A4/A5 -&gt; top mux only. A6/A7 -&gt; bottom mux only. Do not join the two buses.</text>
<text x="502" y="211" font-size="17" font-weight="normal">3V3 -&gt; both mux VCC/VIN and all six OLED VCC. GND -&gt; every module and switch.</text>
<text x="502" y="242" font-size="17" font-weight="normal">Each mux RESET has its own 10 kΩ pull-up to 3V3. Do not join RESET nets.</text>
<text x="502" y="273" font-size="17" font-weight="normal">I²C pull-ups to 3V3: each upstream bus + each used downstream pair, if absent.</text>
<text x="502" y="304" font-size="17" font-weight="normal">Use module pin labels. This is a logical schematic, not physical connector order.</text>
<rect x="40" y="360" width="390" height="265" rx="12" class="box"/>
<text x="60" y="395" font-size="23" font-weight="bold">MUX 1 · TCA9548A · 0x70</text>
<text x="60" y="425" font-size="16" font-weight="normal">SDA &lt;- A4    SCL &lt;- A5</text>
<text x="60" y="452" font-size="16" font-weight="normal">RESET &lt;- D8    VCC &lt;- 3V3</text>
<text x="60" y="479" font-size="16" font-weight="normal">A2=GND  A1=GND  A0=GND</text>
<text x="60" y="511" font-size="17" font-weight="bold">SD0 -&gt; K1_SDA    SC0 -&gt; K1_SCL</text>
<text x="60" y="540" font-size="17" font-weight="bold">SD1 -&gt; K2_SDA    SC1 -&gt; K2_SCL</text>
<text x="60" y="569" font-size="17" font-weight="bold">SD2 -&gt; K3_SDA    SC2 -&gt; K3_SCL</text>
<text x="60" y="607" font-size="15" font-weight="normal">Channels 3–7: leave unconnected</text>
<rect x="480" y="360" width="290" height="265" rx="12" class="box"/>
<text x="497" y="393" font-size="21" font-weight="bold">KEY 1 · TOP</text>
<text x="497" y="422" font-size="15" font-weight="normal">LEFT</text>
<text x="497" y="456" font-size="17" font-weight="normal">OLED SDA &lt;- K1_SDA</text>
<text x="497" y="484" font-size="17" font-weight="normal">OLED SCL &lt;- K1_SCL</text>
<text x="497" y="512" font-size="16" font-weight="normal">OLED VCC=3V3, GND=GND</text>
<path d="M498 531L752 531" class="wire"/>
<text x="497" y="561" font-size="19" font-weight="bold">Switch: D2 -- GND</text>
<text x="497" y="588" font-size="16" font-weight="normal">D2 = GPIO5</text>
<text x="497" y="611" font-size="14" font-weight="normal">Normally open; internal pull-up</text>
<rect x="790" y="360" width="290" height="265" rx="12" class="box"/>
<text x="807" y="393" font-size="21" font-weight="bold">KEY 2 · TOP</text>
<text x="807" y="422" font-size="15" font-weight="normal">MIDDLE</text>
<text x="807" y="456" font-size="17" font-weight="normal">OLED SDA &lt;- K2_SDA</text>
<text x="807" y="484" font-size="17" font-weight="normal">OLED SCL &lt;- K2_SCL</text>
<text x="807" y="512" font-size="16" font-weight="normal">OLED VCC=3V3, GND=GND</text>
<path d="M808 531L1062 531" class="wire"/>
<text x="807" y="561" font-size="19" font-weight="bold">Switch: D3 -- GND</text>
<text x="807" y="588" font-size="16" font-weight="normal">D3 = GPIO6</text>
<text x="807" y="611" font-size="14" font-weight="normal">Normally open; internal pull-up</text>
<rect x="1100" y="360" width="290" height="265" rx="12" class="box"/>
<text x="1117" y="393" font-size="21" font-weight="bold">KEY 3 · TOP</text>
<text x="1117" y="422" font-size="15" font-weight="normal">RIGHT</text>
<text x="1117" y="456" font-size="17" font-weight="normal">OLED SDA &lt;- K3_SDA</text>
<text x="1117" y="484" font-size="17" font-weight="normal">OLED SCL &lt;- K3_SCL</text>
<text x="1117" y="512" font-size="16" font-weight="normal">OLED VCC=3V3, GND=GND</text>
<path d="M1118 531L1372 531" class="wire"/>
<text x="1117" y="561" font-size="19" font-weight="bold">Switch: D4 -- GND</text>
<text x="1117" y="588" font-size="16" font-weight="normal">D4 = GPIO7</text>
<text x="1117" y="611" font-size="14" font-weight="normal">Normally open; internal pull-up</text>
<rect x="40" y="660" width="390" height="265" rx="12" class="box"/>
<text x="60" y="695" font-size="23" font-weight="bold">MUX 2 · TCA9548A · 0x70</text>
<text x="60" y="725" font-size="16" font-weight="normal">SDA &lt;- A6    SCL &lt;- A7</text>
<text x="60" y="752" font-size="16" font-weight="normal">RESET &lt;- D9    VCC &lt;- 3V3</text>
<text x="60" y="779" font-size="16" font-weight="normal">A2=GND  A1=GND  A0=GND</text>
<text x="60" y="811" font-size="17" font-weight="bold">SD0 -&gt; K4_SDA    SC0 -&gt; K4_SCL</text>
<text x="60" y="840" font-size="17" font-weight="bold">SD1 -&gt; K5_SDA    SC1 -&gt; K5_SCL</text>
<text x="60" y="869" font-size="17" font-weight="bold">SD2 -&gt; K6_SDA    SC2 -&gt; K6_SCL</text>
<text x="60" y="907" font-size="15" font-weight="normal">Channels 3–7: leave unconnected</text>
<rect x="480" y="660" width="290" height="265" rx="12" class="box"/>
<text x="497" y="693" font-size="21" font-weight="bold">KEY 4 · BOTTOM</text>
<text x="497" y="722" font-size="15" font-weight="normal">LEFT</text>
<text x="497" y="756" font-size="17" font-weight="normal">OLED SDA &lt;- K4_SDA</text>
<text x="497" y="784" font-size="17" font-weight="normal">OLED SCL &lt;- K4_SCL</text>
<text x="497" y="812" font-size="16" font-weight="normal">OLED VCC=3V3, GND=GND</text>
<path d="M498 831L752 831" class="wire"/>
<text x="497" y="861" font-size="19" font-weight="bold">Switch: D5 -- GND</text>
<text x="497" y="888" font-size="16" font-weight="normal">D5 = GPIO8</text>
<text x="497" y="911" font-size="14" font-weight="normal">Normally open; internal pull-up</text>
<rect x="790" y="660" width="290" height="265" rx="12" class="box"/>
<text x="807" y="693" font-size="21" font-weight="bold">KEY 5 · BOTTOM</text>
<text x="807" y="722" font-size="15" font-weight="normal">MIDDLE</text>
<text x="807" y="756" font-size="17" font-weight="normal">OLED SDA &lt;- K5_SDA</text>
<text x="807" y="784" font-size="17" font-weight="normal">OLED SCL &lt;- K5_SCL</text>
<text x="807" y="812" font-size="16" font-weight="normal">OLED VCC=3V3, GND=GND</text>
<path d="M808 831L1062 831" class="wire"/>
<text x="807" y="861" font-size="19" font-weight="bold">Switch: D6 -- GND</text>
<text x="807" y="888" font-size="16" font-weight="normal">D6 = GPIO9</text>
<text x="807" y="911" font-size="14" font-weight="normal">Normally open; internal pull-up</text>
<rect x="1100" y="660" width="290" height="265" rx="12" class="box"/>
<text x="1117" y="693" font-size="21" font-weight="bold">KEY 6 · BOTTOM</text>
<text x="1117" y="722" font-size="15" font-weight="normal">RIGHT</text>
<text x="1117" y="756" font-size="17" font-weight="normal">OLED SDA &lt;- K6_SDA</text>
<text x="1117" y="784" font-size="17" font-weight="normal">OLED SCL &lt;- K6_SCL</text>
<text x="1117" y="812" font-size="16" font-weight="normal">OLED VCC=3V3, GND=GND</text>
<path d="M1118 831L1372 831" class="wire"/>
<text x="1117" y="861" font-size="19" font-weight="bold">Switch: D7 -- GND</text>
<text x="1117" y="888" font-size="16" font-weight="normal">D7 = GPIO10</text>
<text x="1117" y="911" font-size="14" font-weight="normal">Normally open; internal pull-up</text>
<text x="40" y="966" font-size="19" font-weight="bold">Matching net names connect together. Each Kx_SDA / Kx_SCL pair goes to only that OLED.</text>
<text x="40" y="999" font-size="18" font-weight="normal">Each key press launches the bottom wave: 8 px thick, 120 px/s. One channel per bus; both rows run concurrently.</text>
<text x="40" y="1032" font-size="17" font-weight="normal">400 kHz per bus; 50 FPS target per key (not measured). Keep wiring short; check existing pull-ups.</text>
<text x="40" y="1065" font-size="17" font-weight="normal">Disconnect USB before wiring. Use 3.3 V-compatible breakouts; never connect 5 V pull-ups to Nano GPIO.</text>
<text x="40" y="1098" font-size="17" font-weight="normal">RESET is the mux reset input, not the Nano RST pin. Both muxes: A0/A1/A2 to GND for 0x70 on separate buses.</text>
</svg>